<!doctype html>
<html lang="en" data-type="software" data-radius="soft" data-buttons="pill" data-tone="dark" data-motion>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="site-kind" content="software" />
		<meta name="page-type" content="software" />
		<!-- The taste kit, vendored under static/kit; %sveltekit.assets% carries the Pages base path. -->
		<link rel="stylesheet" href="%sveltekit.assets%/kit/system.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/kit/ui/cards.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/kit/motion/motion.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/kit/layout/layout.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/kit/icons/icon.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/kit/ui/base.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/kit/ui/terminal-run/fragment.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/kit/moments/pinned-chapters/moment.css" />
		<!-- Fetched alongside the app bundle; +layout.svelte runs them after hydration. -->
		<link rel="modulepreload" href="%sveltekit.assets%/kit/system.js" />
		<link rel="modulepreload" href="%sveltekit.assets%/kit/motion/motion.js" />
		<link rel="modulepreload" href="%sveltekit.assets%/kit/layout/layout.js" />
		<link rel="modulepreload" href="%sveltekit.assets%/kit/ui/ui.js" />
		<link rel="modulepreload" href="%sveltekit.assets%/kit/ui/terminal-run/fragment.js" />
		<link rel="modulepreload" href="%sveltekit.assets%/kit/moments/moments.js" />
		<link rel="modulepreload" href="%sveltekit.assets%/kit/moments/lib.js" />
		<link rel="modulepreload" href="%sveltekit.assets%/kit/moments/pinned-chapters/moment.js" />
		<script>
			document.documentElement.classList.add('m-enter', 'mo-js');
			setTimeout(() => document.documentElement.classList.add('m-enter-done'), 700);
			setTimeout(() => document.documentElement.classList.add('mo-safe'), 2500);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
